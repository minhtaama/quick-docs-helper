<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khai Báo Lý Lịch Cá Nhân - Quick Docs Helper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #a78bfa;
            margin: 24px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        input[type="file"] {
            padding: 9px 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #475569;
        }

        .btn-submit {
            margin-top: 32px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>TỜ KHAI LÝ LỊCH CÁ NHÂN</h1>
        <p>Nhập thông tin bên dưới để hệ thống tự động xuất ra file Word (.docx)</p>
    </div>

    <form id="lyLichForm" enctype="multipart/form-data">
        <div class="section-title">I. Thông Tin Cá Nhân & Ảnh</div>
        <div class="grid">
            <div class="form-group">
                <label>Ảnh Chân Dung (3x4)</label>
                <input type="file" name="image" accept="image/*">
            </div>
            <div class="form-group">
                <label>Họ và Tên (*)</label>
                <input type="text" name="ho_ten" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label>Giới Tính</label>
                <input type="text" name="gioi_tinh" placeholder="Nam / Nữ">
            </div>
        </div>

        <div class="section-title">II. Ngày Sinh & Quê Quán</div>
        <div class="grid-3">
            <div class="form-group">
                <label>Ngày Sinh</label>
                <input type="text" name="ngay_sinh" placeholder="15">
            </div>
            <div class="form-group">
                <label>Tháng Sinh</label>
                <input type="text" name="thang_sinh" placeholder="08">
            </div>
            <div class="form-group">
                <label>Năm Sinh</label>
                <input type="text" name="nam_sinh" placeholder="1995">
            </div>
        </div>
        <div class="grid" style="margin-top: 16px;">
            <div class="form-group">
                <label>Nơi Sinh</label>
                <input type="text" name="noi_sinh" placeholder="Hà Nội">
            </div>
            <div class="form-group">
                <label>Quê Quán</label>
                <input type="text" name="que_quan" placeholder="Nam Định">
            </div>
            <div class="form-group">
                <label>Quốc Tịch</label>
                <input type="text" name="quoc_tich" value="Việt Nam">
            </div>
            <div class="form-group">
                <label>Dân Tộc</label>
                <input type="text" name="dan_toc" value="Kinh">
            </div>
            <div class="form-group">
                <label>Tôn Giáo</label>
                <input type="text" name="ton_giao" value="Không">
            </div>
        </div>

        <div class="section-title">III. Giấy Tờ Căn Cước / CMND</div>
        <div class="grid">
            <div class="form-group">
                <label>Số CCCD / CMND / Hộ Chiếu</label>
                <input type="text" name="cccd" placeholder="001095xxxxxx">
            </div>
            <div class="form-group">
                <label>Nơi Cấp CCCD</label>
                <input type="text" name="noi_cap_cccd" placeholder="Cục Cảnh sát QLHC về TTXH">
            </div>
        </div>
        <div class="grid-3" style="margin-top: 16px;">
            <div class="form-group">
                <label>Ngày Cấp</label>
                <input type="text" name="ngay_cccd" placeholder="01">
            </div>
            <div class="form-group">
                <label>Tháng Cấp</label>
                <input type="text" name="thang_cccd" placeholder="01">
            </div>
            <div class="form-group">
                <label>Năm Cấp</label>
                <input type="text" name="nam_cccd" placeholder="2021">
            </div>
        </div>

        <div class="section-title">IV. Học Vấn & Công Việc</div>
        <div class="grid">
            <div class="form-group">
                <label>Trình Độ Học Vấn</label>
                <input type="text" name="hoc_van" placeholder="Đại học">
            </div>
            <div class="form-group">
                <label>Nghề Nghiệp</label>
                <input type="text" name="nghe_nghiep" placeholder="Kỹ sư phần mềm">
            </div>
            <div class="form-group">
                <label>Nơi Làm Việc</label>
                <input type="text" name="noi_lam_viec" placeholder="Công ty ABC">
            </div>
            <div class="form-group">
                <label>Chức Vụ / Đoàn Thể</label>
                <input type="text" name="chuc_vu" placeholder="Trưởng phòng">
            </div>
            <div class="form-group">
                <label>Đoàn Thể / Đảng Phái</label>
                <input type="text" name="doan_the" placeholder="Đoàn viên">
            </div>
        </div>

        <div class="section-title">V. Đơn Vị Cư Trú</div>
        <div class="grid">
            <div class="form-group full-width">
                <label>Nơi Thường Trú</label>
                <input type="text" name="noi_thuong_tru" placeholder="Số 123, đường XYZ, quận ABC, Hà Nội">
            </div>
            <div class="form-group full-width">
                <label>Nơi Tạm Trú</label>
                <input type="text" name="noi_tam_tru" placeholder="Số 456, đường DEF, quận GHI, Hà Nội">
            </div>
            <div class="form-group full-width">
                <label>Nơi Ở Hiện Tại</label>
                <input type="text" name="noi_o_hien_tai" placeholder="Số 456, đường DEF, quận GHI, Hà Nội">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">TẠO & TẢI FILE WORD (.DOCX)</span>
        </button>
    </form>
</div>

<script>
    document.getElementById('lyLichForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');

        submitBtn.disabled = true;
        spinner.style.display = 'block';
        btnText.textContent = 'Đang xử lý xuất file...';

        try {
            const formData = new FormData(this);
            const response = await fetch('/api/documents/generate-ly-lich', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Có lỗi xảy ra khi xuất file Word');
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            
            const contentDisposition = response.headers.get('content-disposition');
            let filename = 'LyLichCaNhan.docx';
            if (contentDisposition) {
                const match = contentDisposition.match(/filename="?([^"]+)"?/);
                if (match && match[1]) filename = match[1];
            }

            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);
        } catch (err) {
            alert('Lỗi: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = 'TẠO & TẢI FILE WORD (.DOCX)';
        }
    });
</script>

</body>
</html>
