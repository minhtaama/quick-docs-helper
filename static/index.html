<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Times New Roman Font Support for Flutter Web CanvasKit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Times New Roman';
      font-style: normal;
      font-weight: 400;
      src: local('Times New Roman'), local('TimesNewRoman'), local('Times'), local('Tinos'), url('https://fonts.gstatic.com/s/tinos/v24/buEzpo6gcdJY0P34G0Qk.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Times New Roman';
      font-style: normal;
      font-weight: 700;
      src: local('Times New Roman Bold'), local('TimesNewRoman-Bold'), local('Tinos Bold'), url('https://fonts.gstatic.com/s/tinos/v24/buExpocgcdJY0P34C1cvZjZc.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Times New Roman';
      font-style: italic;
      font-weight: 400;
      src: local('Times New Roman Italic'), local('TimesNewRoman-Italic'), local('Tinos Italic'), url('https://fonts.gstatic.com/s/tinos/v24/buEypocgcdJY0P34M2EkZg.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Times New Roman';
      font-style: italic;
      font-weight: 700;
      src: local('Times New Roman Bold Italic'), local('TimesNewRoman-BoldItalic'), local('Tinos Bold Italic'), url('https://fonts.gstatic.com/s/tinos/v24/buEwpocgcdJY0P34M2EkZjpcegI.woff2') format('woff2');
    }
    body, * {
      font-family: 'Times New Roman', 'Tinos', 'Noto Serif', serif;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
